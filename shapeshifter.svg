      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="60%" stop-color="#cc2000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
